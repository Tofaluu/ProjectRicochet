# Runs on the cloud server in ~/ricochet (copied there by the deploy job with a .env holding TAG,
# the image's commit). Lobbies live in memory, so restarting the server ends every game in progress.
# db.env (created once on the server, never in the repo) holds the database password:
#   POSTGRES_PASSWORD=...
#   ConnectionStrings__Daily=Host=db;Database=ricochet;Username=ricochet;Password=...
services:
  server:
    image: ghcr.io/tofaluu/ricochet-server:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: db.env
        required: false   # without it the daily puzzle keeps results in memory
    depends_on:
      db:
        condition: service_healthy

  # Daily puzzle results. Small settings for the 1 GB server.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: db.env
        required: false
    environment:
      POSTGRES_DB: ricochet
      POSTGRES_USER: ricochet
    command: postgres -c shared_buffers=64MB -c max_connections=20 -c work_mem=4MB
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricochet -d ricochet"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro   # the browser build (Tools/deploy-web.sh)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:
  db_data:
