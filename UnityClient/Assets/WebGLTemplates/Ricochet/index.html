<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The default palette (Toybox night); the script below swaps in the player's own palette, which the game saves. */
      :root { --bg: #1f1914; --text: #f6eedd; --muted: #a0998d; --accent: #26914f; --track: #3f3932; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      /* 100dvh = the visible height: on phones and tablets 100vh also counts the area under the browser's toolbars,
         which cut off the bottom of the game. */
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
        background: var(--bg); outline: none; touch-action: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; padding: 0 16px; text-align: center; }
      #loading h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
      #loading p { margin: 0; color: var(--muted); font-size: 14px; }
      #bar { width: min(320px, 80vw); height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
      #bar-fill { width: 0; height: 100%; background: var(--accent); transition: width 0.2s; }
      #error { display: none; color: #f07a7a; max-width: 480px; }
    </style>
    <script>
      // The palette the player picked last visit (saved by the game: Theme/Palette.cs, Plugins/WebGL/Viewport.jslib).
      try {
        var saved = JSON.parse(localStorage.getItem("ricochet.loadingColors") || "null");
        for (var key in saved)
          if (/^#[0-9a-f]{6}$/i.test(saved[key]))
            document.documentElement.style.setProperty("--" + key, saved[key]);
      } catch (e) { }
    </script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <p id="hint">Loading...</p>
      <p id="error"></p>
    </div>
    <!-- The JavaScript SignalR client used by Plugins/WebGL/RicochetHub.jslib (MIT, see THIRD-PARTY-NOTICES.md). -->
    <script src="signalr.min.js"></script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.querySelector("#bar-fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#hint").style.display = "none";
        var error = document.querySelector("#error");
        error.textContent = "The game couldn't start: " + message;
        error.style.display = "block";
      });
    </script>
  </body>
</html>
